{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4 border-top border-purple border-4" style="border-top-color: #6f42c1 !important;">
            <h3 class="text-center mb-4 text-purple">System Login</h3>
            <form method="POST" action="/">
                <div class="mb-3">
                    <label class="form-label">Select Role</label>
                    <select class="form-select" name="role" id="roleSelect" onchange="togglePassword()">
                        <option value="student">Student (View Only)</option>
                        <option value="college">College Admin (Manage Data)</option>
                    </select>
                </div>
                <div class="mb-3" id="passwordField" style="display: none;">
                    <label class="form-label">Admin Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Hint: admin123">
                </div>
                <button type="submit" class="btn btn-dark w-100 mt-3">Access System</button>
            </form>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        var role = document.getElementById("roleSelect").value;
        var passField = document.getElementById("passwordField");
        passField.style.display = (role === "college") ? "block" : "none";
    }
</script>
{% endblock %}
