{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="mb-4 text-purple">Add New Placement Record</h4>
            <form method="POST" action="/add">
                <div class="mb-3">
                    <label>Student Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="mb-3">
                    <label>Company</label>
                    <input type="text" class="form-control" name="company" placeholder="Enter 'None' if not placed" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Salary (LPA)</label>
                        <input type="number" step="0.1" class="form-control" name="salary" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Year</label>
                        <input type="number" class="form-control" name="year" value="2024" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label>Status</label>
                    <select class="form-select" name="status" required>
                        <option value="Placed">Placed</option>
                        <option value="Not Placed">Not Placed</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-purple w-100">Save Record to Database</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
